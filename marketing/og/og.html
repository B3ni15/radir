<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Radír link-előnézet</title>
<!-- 1200×630-as Open Graph kép a weboldalhoz. Render: swift marketing/snap.swift marketing/og/og.html web/public/img/og.jpg 1200 630 -->
<style>
  @font-face { font-family: M; src: url(../../Radir/Fonts/Montserrat-Medium.ttf); font-weight: 500; }
  @font-face { font-family: M; src: url(../../Radir/Fonts/Montserrat-ExtraBold.ttf); font-weight: 800; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: M, sans-serif; color: #15161A; background: #F4F3EE;
         background-image: linear-gradient(rgba(110,112,122,.13) 2px, transparent 2px), linear-gradient(90deg, rgba(110,112,122,.13) 2px, transparent 2px);
         background-size: 42px 42px; }
  .copy { position: absolute; left: 72px; top: 80px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 40px; }
  .brand img { width: 76px; height: 76px; border-radius: 19px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  h1 { margin-top: 44px; font-weight: 800; font-size: 78px; line-height: 1; letter-spacing: -3px; }
  p { margin-top: 26px; font-weight: 500; font-size: 29px; line-height: 1.3; color: #5F616A; max-width: 560px; }
  svg { position: absolute; inset: 0; }
  .phone { position: absolute; width: 300px; padding: 9px; border-radius: 46px; background: #0b0c0f; box-shadow: inset 0 0 0 3px #2a2c31, 0 30px 60px rgba(20,22,40,.25); }
  .phone img { display: block; width: 100%; border-radius: 38px; }
  .phone::after { content: ""; position: absolute; top: 19px; left: 50%; width: 82px; height: 24px; margin-left: -41px; border-radius: 12px; background: #000; }
</style>
</head>
<body>
  <svg width="1200" height="630" viewBox="0 0 1200 630">
    <path d="M -20 612 C 220 640, 460 560, 640 590 C 760 610, 740 520, 690 540 C 640 560, 690 640, 820 600 C 980 550, 1100 470, 1230 480"
          fill="none" stroke="#2F6FEB" stroke-width="9" stroke-linecap="round" opacity=".55"/>
  </svg>
  <div class="copy">
    <div class="brand"><img src="../../Radir/Assets.xcassets/Logo.imageset/Logo.png" alt="">Radír</div>
    <h1>A KRÉTA, ahogy szeretnéd</h1>
    <p>Jegyek, átlagok, órarend és Live Activity iPhone-ra. Ingyen.</p>
  </div>
  <div class="phone" style="left:700px;top:70px;transform:rotate(-6deg)"><img src="../raw/home-light.png" alt=""></div>
  <div class="phone" style="left:910px;top:140px;transform:rotate(6deg)"><img src="../raw/grades-light.png" alt=""></div>
</body>
