<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>KRÉTA API link-előnézet</title>
<!-- 1200×630 OG kép a /kreta-api/ oldalhoz. Render: swift marketing/snap.swift marketing/og/og-api.html web/public/img/og-api.jpg 1200 630 -->
<style>
  @font-face { font-family: M; src: url(../../Radir/Fonts/Montserrat-Medium.ttf); font-weight: 500; }
  @font-face { font-family: M; src: url(../../Radir/Fonts/Montserrat-ExtraBold.ttf); font-weight: 800; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: M, sans-serif; color: #15161A; background: #F4F3EE;
         background-image: linear-gradient(rgba(110,112,122,.13) 2px, transparent 2px), linear-gradient(90deg, rgba(110,112,122,.13) 2px, transparent 2px);
         background-size: 42px 42px; }
  .copy { position: absolute; left: 72px; top: 76px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 32px; }
  .brand img { width: 60px; height: 60px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  h1 { margin-top: 40px; font-weight: 800; font-size: 70px; line-height: .98; letter-spacing: -3px; }
  p { margin-top: 26px; font-weight: 500; font-size: 28px; line-height: 1.3; color: #5F616A; }
  .card { position: absolute; left: 700px; top: 104px; width: 600px; padding: 30px 34px; border-radius: 28px; background: #15161A; color: #E9EAEE;
          box-shadow: 0 40px 80px rgba(20,22,40,.25); transform: rotate(-3deg); font: 600 22px/1 ui-monospace, Menlo, monospace; }
  .row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.08); white-space: nowrap; }
  .row:last-child { border: 0; }
  .m { flex: none; width: 74px; text-align: center; padding: 6px 0; border-radius: 8px; font: 800 17px M, sans-serif; color: #fff; }
  .get { background: #1b9e83; } .post { background: #2F6FEB; } .put { background: #d98a00; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../Radir/Assets.xcassets/Logo.imageset/Logo.png" alt="">Radír</div>
    <h1>KRÉTA API dokumentáció</h1>
    <p>Bejelentkezés, jegyek, órarend, üzenetek, DKT. Ami ma tényleg működik.</p>
  </div>
  <div class="card">
    <div class="row"><span class="m post">POST</span>/connect/token</div>
    <div class="row"><span class="m get">GET</span>/Sajat/Ertekelesek</div>
    <div class="row"><span class="m get">GET</span>/Sajat/OrarendElemek</div>
    <div class="row"><span class="m get">GET</span>/Sajat/Mulasztasok</div>
    <div class="row"><span class="m get">GET</span>/Sajat/HaziFeladatok</div>
    <div class="row"><span class="m get">GET</span>/kommunikacio/postaladaelemek</div>
    <div class="row"><span class="m put">PUT</span>/tanulok/hazifeladatok/beadasok</div>
  </div>
</body>
</html>
